# cargo-deny configuration for the sew-crates workspace (`cargo deny check` from this
# directory). The advisory exceptions and their reasons are Alakazam Labs' own assessment.

[graph]
all-features = false

[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 is unmaintained. Sew's assessment: it comes only through Tauri's GTK3 stack (glib-macros, gtk3-macros) and is a proc-macro, run at compile time only, with no code in the built binary." },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: an unmaintained notice only, with no vulnerability advisory. Reached on Linux through zbus 4: keyring's Secret Service backend, a default dependency of tauri-plugin-sew-app and behind the keyring-store feature (off by default) in sew-call-client and tauri-plugin-sew-voice. Reached on Linux through zbus 5: kessel-video's Linux backends, behind the video feature (off by default) in sew-call-client and tauri-plugin-sew-voice, and Tauri's notification and single-instance plugins in tauri-plugin-sew-app's default graph. Clears when these move to a maintained zbus. Any vulnerability advisory on these paths blocks." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: an unmaintained notice only, with no vulnerability advisory. Reached on Linux through zbus 4: keyring's Secret Service backend, a default dependency of tauri-plugin-sew-app and behind the keyring-store feature (off by default) in sew-call-client and tauri-plugin-sew-voice. Reached on Linux through zbus 5: kessel-video's Linux backends, behind the video feature (off by default) in sew-call-client and tauri-plugin-sew-voice, and Tauri's notification and single-instance plugins in tauri-plugin-sew-app's default graph. Clears when these move to a maintained zbus. Any vulnerability advisory on these paths blocks." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: an unmaintained notice only, with no vulnerability advisory. Reached on Linux through zbus 4: keyring's Secret Service backend, a default dependency of tauri-plugin-sew-app and behind the keyring-store feature (off by default) in sew-call-client and tauri-plugin-sew-voice. Reached on Linux through zbus 5: kessel-video's Linux backends, behind the video feature (off by default) in sew-call-client and tauri-plugin-sew-voice, and Tauri's notification and single-instance plugins in tauri-plugin-sew-app's default graph. Clears when these move to a maintained zbus. Any vulnerability advisory on these paths blocks." },
]

[licenses]
version = 2
# The permissive licences these crates and their dependencies may use; nothing else.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # Four more, each ruled on its own.
  "BSL-1.0",
  "Apache-2.0 WITH LLVM-exception",
  "0BSD",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Nine crates are allowed by name, each with its own licence; any other crate with a licence
# outside the allowlist fails. The allowlist itself also holds CDLA-Permissive-2.0 and
# Apache-2.0 WITH LLVM-exception, so the webpki-root-certs and target-lexicon rows below are kept
# as the record of their rulings.
exceptions = [
  # Tauri 2's own MPL-2.0 crates (HTML tooling through tauri-utils; option-ext through dirs),
  # in tauri-plugin-sew-voice's default graph.
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  # Mozilla's root certificates as data, through rustls-platform-verifier.
  { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
  # A build-time dependency through Tauri.
  { crate = "target-lexicon", allow = ["Apache-2.0 WITH LLVM-exception"] },
  # CC0-1.0 allowed for tiny-keccak by name (card 70d82c46): build-time only,
  # through const-random-macro (a proc-macro; rust-ini, from tauri-plugin-deep-link on Linux,
  # in tauri-plugin-sew-app's default graph).
  { name = "tiny-keccak", allow = ["CC0-1.0"] },
  # CC0-1.0 allowed for to_method by name, so this file stays in step with the private
  # workspace's config; the mirror's own graph does not reach it.
  { name = "to_method", allow = ["CC0-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Two git sources, each only at an exact rev (required-git-spec refuses a branch or tag). Both
# are allowed so this file stays in step with the private workspace's config; the mirror's own
# graph reaches neither (its Cargo.lock has no git source).
allow-git = [
  "https://github.com/Alakazam-211/str0m",
  "https://github.com/huggingface/candle",
]
required-git-spec = "rev"
