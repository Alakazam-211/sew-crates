# The Sew crates (packaged by Sew's scripts/package-public-crates.sh).
[workspace]
resolver = "3"
members = ["sew-proto", "sew-lkproto", "sew-mls-crypto", "sew-e2ee", "sew-lk-compat", "sew-call-client", "tauri-plugin-sew-voice"]

# The seven crates depend on each other by version; inside this workspace each one is the
# member of that name. The str0m and dimpl forks are public (MIT / Apache-2.0); kessel-audio
# (MIT OR Apache-2.0) is K2's audio pipeline, not on crates.io: a consumer supplies it.
# A [patch] applies only from the workspace root: a consumer repeats these rows in its own
# root Cargo.toml (see README.md).
[patch.crates-io]
sew-proto = { path = "sew-proto" }
sew-lkproto = { path = "sew-lkproto" }
sew-mls-crypto = { path = "sew-mls-crypto" }
sew-e2ee = { path = "sew-e2ee" }
sew-lk-compat = { path = "sew-lk-compat" }
sew-call-client = { path = "sew-call-client" }
kessel-audio    = { git = "https://github.com/Alakazam-211/k2", rev = "bc78b69a6640a533d11edf1be2feaa615416cda8" }
str0m           = { git = "https://github.com/Alakazam-211/str0m", rev = "f80c8fa09323778b181923a840a9fd36e1c8d951" }
str0m-proto     = { git = "https://github.com/Alakazam-211/str0m", rev = "f80c8fa09323778b181923a840a9fd36e1c8d951" }
is              = { git = "https://github.com/Alakazam-211/str0m", rev = "f80c8fa09323778b181923a840a9fd36e1c8d951" }
str0m-aws-lc-rs = { git = "https://github.com/Alakazam-211/str0m", rev = "f80c8fa09323778b181923a840a9fd36e1c8d951" }
dimpl          = { git = "https://github.com/Alakazam-211/dimpl", rev = "a3481943e8e3fa270990e7c05a27d015cfbe4d77" }
