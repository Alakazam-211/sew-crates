# The Sew crates (packaged by Sew's scripts/package-public-crates.sh).
[workspace]
resolver = "3"
members = ["sew-proto", "sew-lkproto", "sew-mls-crypto", "sew-e2ee", "sew-lk-compat", "sew-call-client", "tauri-plugin-sew-voice"]

# The seven crates depend on each other by version; inside this workspace each one is the
# member of that name. The str0m fork is public (MIT / Apache-2.0).
# A [patch] applies only from the workspace root: a consumer repeats these rows in its own
# root Cargo.toml (see README.md).
[patch.crates-io]
sew-proto = { path = "sew-proto" }
sew-lkproto = { path = "sew-lkproto" }
sew-mls-crypto = { path = "sew-mls-crypto" }
sew-e2ee = { path = "sew-e2ee" }
sew-lk-compat = { path = "sew-lk-compat" }
sew-call-client = { path = "sew-call-client" }
str0m           = { git = "https://github.com/Alakazam-211/str0m", rev = "907e050bfa212a23394f4482110acef04cba8fc6" }
str0m-proto     = { git = "https://github.com/Alakazam-211/str0m", rev = "907e050bfa212a23394f4482110acef04cba8fc6" }
is              = { git = "https://github.com/Alakazam-211/str0m", rev = "907e050bfa212a23394f4482110acef04cba8fc6" }
str0m-aws-lc-rs = { git = "https://github.com/Alakazam-211/str0m", rev = "907e050bfa212a23394f4482110acef04cba8fc6" }
