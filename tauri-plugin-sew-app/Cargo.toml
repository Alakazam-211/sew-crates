    "CHANGELOG.md",
]
publish = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The shell of a Tauri 2 App on a Sew server: saved servers, sign-in and the device session in the OS keychain, a ready voice JoinProvider, the webview handoff, an API transport for a bundled UI, deep links, single instance and notifications."
homepage = "https://github.com/Alakazam-211/sew-crates/tree/main/tauri-plugin-sew-app"
